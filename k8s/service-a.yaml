
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: boheri/service-a:2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ServiceB__BaseUrl
              value: "http://service-b:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  type: LoadBalancer
  selector:
    app: service-a
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
