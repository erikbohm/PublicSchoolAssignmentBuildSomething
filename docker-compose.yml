
services:
  service-a:
    build:
      context: .
      dockerfile: ServiceA/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ServiceB__BaseUrl: "http://service-b:8080"
    depends_on:
      - service-b

  service-b:
    build:
      context: .
      dockerfile: ServiceB/Dockerfile
    ports:
      - "5002:8080"
